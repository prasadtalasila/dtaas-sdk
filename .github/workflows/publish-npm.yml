name: Publish npm package

'on':
  workflow_call:
    inputs:
      registry-url:
        required: true
        type: string
      node-version:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.registry-url }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write  # Push to github package registry
      contents: read  # Required for checking out the code
    steps:
      - name: Checkout
        # v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          lfs: false

      - name: Setup node
        # v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          yarn build
          # A prerelease (e.g. 1.0.0-alpha.1) must not become the "latest" tag.
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) TAG=next ;;
            *) TAG=latest ;;
          esac
          yarn publish --access public --non-interactive --tag "$TAG"
